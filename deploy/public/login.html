<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Adit Pay Adoption Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#16211D; --ink-soft:#4B584F; --paper:#F7F5EF; --surface:#FFFFFF;
    --line:#E1DCCC; --line-strong:#C9C2AD;
    --accent:#2F6F5E; --accent-strong:#1F5245; --accent-soft:#E4EEE9;
    --amber:#B8702F; --amber-soft:#F7EADA;
    --danger:#AE3B3B; --danger-soft:#F8E4E2;
    --shadow: 0 1px 2px rgba(22,33,29,.06), 0 6px 20px rgba(22,33,29,.05);
    --radius:18px;
    font-size:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEAE0; --ink-soft:#AEB6AC; --paper:#141B17; --surface:#1B241F;
      --line:#2B3830; --line-strong:#3B4A41;
      --accent:#59B99B; --accent-strong:#7ED4B6; --accent-soft:#1E3129;
      --amber:#E0A15C; --amber-soft:#3A2A18;
      --danger:#E28080; --danger-soft:#3A2020;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; position:relative; overflow-x:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,h2{font-family:"Fraunces","Georgia",serif; font-weight:600; margin:0;}

  .bg-orbs{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .orb{position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; animation:orbFloat 20s ease-in-out infinite;}
  .orb-a{width:440px; height:440px; background:var(--accent-soft); top:-140px; left:-120px;}
  .orb-b{width:400px; height:400px; background:var(--amber-soft); bottom:-160px; right:-100px; animation-delay:-7s;}
  .orb-c{width:280px; height:280px; background:var(--accent-soft); top:38%; right:10%; animation-delay:-13s;}
  @keyframes orbFloat{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(26px,-22px) scale(1.08); }
  }

  .card-wrap{position:relative; z-index:1; width:100%; max-width:400px;}
  .card-border{
    padding:1px; border-radius:calc(var(--radius) + 1px);
    background:linear-gradient(155deg, var(--accent) 0%, var(--line) 45%, var(--amber) 100%);
    box-shadow:0 2px 4px rgba(22,33,29,.07), 0 30px 70px rgba(22,33,29,.16);
    animation:fadeInUp .55s ease both;
  }
  @keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .card{
    background:var(--surface); border-radius:var(--radius);
    padding:40px 34px 32px; text-align:center;
  }
  .mark{
    position:relative; width:58px; height:58px; border-radius:15px; background:var(--surface);
    margin:0 auto 22px; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); border:1px solid var(--line); padding:9px;
  }
  .mark::before{
    content:""; position:absolute; inset:-14px; z-index:-1; border-radius:24px;
    background:radial-gradient(circle, var(--accent-soft), transparent 70%);
  }
  .mark img, .mark svg{width:100%;height:100%;object-fit:contain;display:block;}
  .eyebrow{
    text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:600;
    color:var(--accent); margin:0 0 10px;
  }
  h1{font-size:22px; line-height:1.25;}
  .sub{color:var(--ink-soft); font-size:14px; margin:10px 0 30px; line-height:1.55;}
  #gsiBtn{display:flex; justify-content:center; min-height:44px;}
  .trust{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:18px; font-size:12px; color:var(--ink-soft);
  }
  .trust svg{width:13px; height:13px; color:var(--accent); flex:none;}
  .foot{margin-top:20px; font-size:12px; color:var(--ink-soft);}
  .err{
    display:none; margin-top:18px; padding:10px 14px; border-radius:10px;
    background:var(--danger-soft); color:var(--danger); font-size:13px; text-align:left;
  }
  .err.show{display:block;}
  .loading{display:none; margin-top:18px; font-size:13px; color:var(--ink-soft);}
  .loading.show{display:block;}
  @media (prefers-reduced-motion: reduce){
    .orb{animation:none;}
    .card-border{animation:none;}
  }
</style>
</head>
<body>

        <p class="sub">Sign in with Google to continue. Access is granted individually &mdash; your account must be approved before you can sign in.</p>

          Secured with Google Sign-In

      </div>

  </div>

<script>
  function showError(msg){
    var e = document.getElementById("errMsg");
    e.textContent = msg;
    e.classList.add("show");
    document.getElementById("loadingMsg").classList.remove("show");
  }
  function handleCredential(response){
    document.getElementById("errMsg").classList.remove("show");
    document.getElementById("loadingMsg").classList.add("show");
    fetch("/auth/google", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({credential: response.credential})
    }).then(function(r){
      if (r.ok) { window.location.href = "/"; return; }
      return r.json().then(function(data){ throw new Error((data && data.error) || "Sign-in failed."); });
    }).catch(function(err){
      showError(err.message || "Sign-in failed. Please try again.");
    });
  }
  function waitForGoogle(timeoutMs, cb){
    var start = Date.now();
    (function poll(){
      if (window.google && google.accounts && google.accounts.id){ cb(true); return; }
      if (Date.now() - start > timeoutMs){ cb(false); return; }
      setTimeout(poll, 100);
    })();
  }
  fetch("/auth/config").then(function(r){ return r.json(); }).then(function(cfg){
    if (!cfg || !cfg.clientId){
      showError("Sign-in isn't configured yet. Ask an admin to set GOOGLE_CLIENT_ID.");
      return;
    }
    waitForGoogle(8000, function(ok){
      if (!ok){
        showError("Couldn't load Google Sign-In. Check your connection and reload.");
        return;
      }
      google.accounts.id.initialize({
        client_id: cfg.clientId,
        callback: handleCredential
      });
      google.accounts.id.renderButton(document.getElementById("gsiBtn"), {
        theme: "outline", size: "medium", shape: "pill", width: 300, text: "signin"
      });
    });
  }).catch(function(){
    showError("Couldn't reach the sign-in service. Please reload.");
  });
</script>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Adit Pay Adoption Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#16211D; --ink-soft:#4B584F; --paper:#F7F5EF; --surface:#FFFFFF;
    --line:#E1DCCC; --line-strong:#C9C2AD;
    --accent:#2F6F5E; --accent-strong:#1F5245; --accent-soft:#E4EEE9;
    --danger:#AE3B3B; --danger-soft:#F8E4E2;
    --shadow: 0 1px 2px rgba(22,33,29,.06), 0 6px 20px rgba(22,33,29,.05);
    --radius:16px;
    font-size:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEAE0; --ink-soft:#AEB6AC; --paper:#141B17; --surface:#1B241F;
      --line:#2B3830; --line-strong:#3B4A41;
      --accent:#59B99B; --accent-strong:#7ED4B6; --accent-soft:#1E3129;
      --danger:#E28080; --danger-soft:#3A2020;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:
      radial-gradient(1200px 600px at 15% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--accent-soft), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,h2{font-family:"Fraunces","Georgia",serif; font-weight:600; margin:0;}
  .card{
    width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:0 2px 4px rgba(22,33,29,.06), 0 24px 60px rgba(22,33,29,.12);
    padding:38px 34px 32px; text-align:center;
    animation:fadeInUp .5s ease both;
  }
  @keyframes fadeInUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
  .mark{
    width:56px;height:56px;border-radius:14px;background:var(--surface);margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:1px solid var(--line);
    padding:9px;
  }
  .mark img{width:100%;height:100%;object-fit:contain;display:block;}
  h1{font-size:22px; line-height:1.25;}
  .sub{color:var(--ink-soft); font-size:14px; margin:10px 0 28px; line-height:1.5;}
  #gsiBtn{display:flex; justify-content:center; min-height:44px;}
  .foot{margin-top:22px; font-size:12px; color:var(--ink-soft);}
  .err{
    display:none; margin-top:18px; padding:10px 14px; border-radius:10px;
    background:var(--danger-soft); color:var(--danger); font-size:13px; text-align:left;
  }
  .err.show{display:block;}
  .loading{display:none; margin-top:18px; font-size:13px; color:var(--ink-soft);}
  .loading.show{display:block;}
</style>
</head>

    <h1>Adit Pay Adoption Analyzer</h1>
    <p class="sub">Sign in with your Adit Google account to continue. Access is restricted to @adit.com.</p>
    <div id="gsiBtn"></div>
    <div class="loading" id="loadingMsg">Signing you in…</div>
    <div class="err" id="errMsg"></div>
    <p class="foot">Adit internal tool · not for external distribution</p>
  </div>

<script>
  function showError(msg){
    var e = document.getElementById("errMsg");
    e.textContent = msg;
    e.classList.add("show");
    document.getElementById("loadingMsg").classList.remove("show");
  }
  function handleCredential(response){
    document.getElementById("errMsg").classList.remove("show");
    document.getElementById("loadingMsg").classList.add("show");
    fetch("/auth/google", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({credential: response.credential})
    }).then(function(r){
      if (r.ok) { window.location.href = "/"; return; }
      return r.json().then(function(data){ throw new Error((data && data.error) || "Sign-in failed."); });
    }).catch(function(err){
      showError(err.message || "Sign-in failed. Please try again.");
    });
  }
  function waitForGoogle(timeoutMs, cb){
    var start = Date.now();
    (function poll(){
      if (window.google && google.accounts && google.accounts.id){ cb(true); return; }
      if (Date.now() - start > timeoutMs){ cb(false); return; }
      setTimeout(poll, 100);
    })();
  }
  fetch("/auth/config").then(function(r){ return r.json(); }).then(function(cfg){
    if (!cfg || !cfg.clientId){
      showError("Sign-in isn't configured yet. Ask an admin to set GOOGLE_CLIENT_ID.");
      return;
    }
    waitForGoogle(8000, function(ok){
      if (!ok){
        showError("Couldn't load Google Sign-In. Check your connection and reload.");
        return;
      }
      google.accounts.id.initialize({
        client_id: cfg.clientId,
        callback: handleCredential
      });
      google.accounts.id.renderButton(document.getElementById("gsiBtn"), {
        theme: "outline", size: "large", shape: "pill", width: 300, text: "signin_with"
      });
    });
  }).catch(function(){
    showError("Couldn't reach the sign-in service. Please reload.");
  });
</script>
